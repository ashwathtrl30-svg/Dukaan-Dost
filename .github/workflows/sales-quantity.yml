name: Sales quantity checks

on:
  push:
    branches:
      - fix/visible-sales-quantity-delete
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Test sale quantity parsing
        run: npx --yes tsx --test src/quantity.test.ts
