name: Voice ledger CI

on:
  push:
    branches:
      - feat/voice-ledger-review-and-hindi-numbers
      - feat/shop-notebook-stage-2
  pull_request:
    branches:
      - main
      - feat/voice-ledger-review-and-hindi-numbers

permissions:
  contents: write

jobs:
  build-and-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit generated npm lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/shop-notebook-stage-2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is unchanged"
          else
            git commit -m "chore: commit npm lockfile"
            git push origin HEAD:feat/shop-notebook-stage-2
          fi
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Build production bundle
        run: npm run build
      - name: Test voice parser examples
        run: npx --yes tsx --test src/voice/voiceCommands.test.ts
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a = require('./npm-audit.json'); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({package: name, severity: v.severity, direct: v.isDirect, range: v.range, fixAvailable: v.fixAvailable})); console.log('Totals:', JSON.stringify(a.metadata?.vulnerabilities || {}));"
