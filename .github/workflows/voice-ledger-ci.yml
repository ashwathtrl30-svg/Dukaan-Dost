name: Voice ledger CI

on:
  push:
    branches:
      - main
      - feat/voice-ledger-review-and-hindi-numbers
      - feat/shop-notebook-stage-2
      - feature/sales-customer-handling-coach
  pull_request:
    branches:
      - main
      - feat/voice-ledger-review-and-hindi-numbers
      - feature/sales-customer-handling-coach

jobs:
  build-and-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Validate protected availability endpoint
        run: |
          node --check api/supabase-keepalive.js
          node --test api/supabase-keepalive.test.js
      - name: Type-check cloud persistence integration
        run: >-
          npx tsc --noEmit --target ES2022 --module ESNext
          --moduleResolution bundler --jsx react-jsx --skipLibCheck
          --allowSyntheticDefaultImports --types vite/client
          src/store.tsx src/cloudPersistence.ts src/shopDataSnapshot.ts
          src/types.ts src/supabaseClient.ts
          src/auth/AuthGate.tsx src/auth/AccountRecoveryPanel.tsx
          src/auth/authValidation.ts src/screens/Profile.tsx src/screens/Onboarding.tsx src/screens/Learn.tsx
          src/coach/types.ts src/coach/coachData.ts src/coach/coachRepository.ts src/coach/coachKnowledge.ts src/coach/coachAssessment.ts src/coach/coachSimulation.ts src/coach/useCoachVoice.ts api/coach-customer.ts
          src/backup/encryptedBackup.ts src/backup/BackupRestorePanel.tsx src/snapshotSync.ts
          src/backup/encryptedBackup.ts src/backup/BackupRestorePanel.tsx
      - name: Test Coach identity and persistence input validation
        run: npx --yes tsx --test src/coach/coachData.test.ts src/coach/coachSchema.test.ts
      - name: Test Coach customer simulation API authentication and preview isolation
        run: npx --yes tsx --test tests/api/coach-customer.test.ts
      - name: Test Indian retail Coach knowledge engine and safety boundaries
        run: npx --yes tsx --test src/coach/coachKnowledge.test.ts src/coach/coachAssessment.test.ts src/coach/coachSimulation.test.ts
      - name: Test Coach speech input, text safety and locale helpers
        run: npx --yes tsx --test src/coach/useCoachVoice.test.ts
      - name: Test cloud shop-data snapshot reconciliation
        run: npx --yes tsx --test src/shopDataSnapshot.test.ts
      - name: Test encrypted backup and guarded restore
        run: npx --yes tsx --test src/backup/encryptedBackup.test.ts src/snapshotRestore.test.ts
      - name: Test identity and recovery validation
        run: npx --yes tsx --test src/auth/authValidation.test.ts
      - name: Test four-pillar My Advice recommendations
        run: npx --yes tsx --test src/insights/myAdvice.test.ts
      - name: Test product identity and pack-size aggregation
        run: npx --yes tsx --test src/insights/productSales.test.ts
      - name: Test dynamic business insights and udhaar alternatives
        run: npx --yes tsx --test src/insights/insightEngine.test.ts
      - name: Test voice parser examples
        run: npx --yes tsx --test src/voice/voiceCommands.test.ts
      - name: Test product-aware voice quantity separation
        run: npx --yes tsx --test supabase/functions/parse-voice-entry/quantityRules.test.ts
      - name: Test AI interpreter and API proxy
        run: npx --yes tsx --test src/voice/voiceInterpreter.test.ts tests/api/parse-voice.test.ts src/voice/speechRecognition.test.ts
      - name: Audit dependencies (block high and critical vulnerabilities)
        run: npm audit --audit-level=high
